services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: page-api-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data

  webhook-service:
    build:
      context: .
      dockerfile: services/webhook-service/Dockerfile
    container_name: page-api-webhook-service
    depends_on:
      - kafka
    ports:
      - "3001:3001"
    environment:
      WEBHOOK_PORT: 3001
      FACEBOOK_VERIFY_TOKEN: ${FACEBOOK_VERIFY_TOKEN:-thanhngan}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      WEBHOOK_SKIP_SIGNATURE: ${WEBHOOK_SKIP_SIGNATURE:-false}
      KAFKA_BROKERS: kafka:9092
      KAFKA_CONNECT_RETRIES: 10
      KAFKA_CONNECT_RETRY_DELAY_MS: 2000

  backend-api:
    build:
      context: .
      dockerfile: services/backend-api/Dockerfile
    container_name: page-api-backend
    depends_on:
      - kafka
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      GRAPH_API_VERSION: ${GRAPH_API_VERSION:-v23.0}
      PAGE_ACCESS_TOKEN: ${PAGE_ACCESS_TOKEN}
      PAGE_ID: ${PAGE_ID}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin_thanhngan_123}
      KAFKA_BROKERS: kafka:9092
      KAFKA_CONNECT_RETRIES: 10
      KAFKA_CONNECT_RETRY_DELAY_MS: 2000
    volumes:
      - backend_data:/app/data

  core-service:
    build:
      context: .
      dockerfile: services/core-service/Dockerfile
    container_name: page-api-core-service
    depends_on:
      - kafka
    ports:
      - "3002:3002"
    environment:
      CORE_PORT: 3002
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      KAFKA_BROKERS: kafka:9092
      KAFKA_CONNECT_RETRIES: 10
      KAFKA_CONNECT_RETRY_DELAY_MS: 2000

  retry-service:
    build:
      context: .
      dockerfile: services/retry-service/Dockerfile
    container_name: page-api-retry-service
    depends_on:
      - kafka
    ports:
      - "3003:3003"
    environment:
      RETRY_PORT: 3003
      KAFKA_BROKERS: kafka:9092
      KAFKA_CONNECT_RETRIES: 10
      KAFKA_CONNECT_RETRY_DELAY_MS: 2000

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: page-api-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  kafka_data:
  backend_data:

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: page-api-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data

  webhook-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: page-api-webhook-service
    depends_on:
      - kafka
    ports:
      - "3001:3001"
    environment:
      WEBHOOK_PORT: 3001
      FACEBOOK_VERIFY_TOKEN: ${FACEBOOK_VERIFY_TOKEN:-my_verify_token}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-change_me}
      WEBHOOK_SKIP_SIGNATURE: ${WEBHOOK_SKIP_SIGNATURE:-false}
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: raw_events
      KAFKA_CLIENT_ID: webhook-service

volumes:
  kafka_data:
